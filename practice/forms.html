<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="forms.css">
</head>
<body>
    <h1>Forms</h1>

    <div class="form-container">
        <h2>Send us a Message</h2>
        <p>This is information for the user</p>

        <form action="">
            <div class="input-container">
                <label>Name:</label>
                <input 
                    type="text"
                    placeholder="Enter your Name"
                    id="txtName" 
                    name="user_name"
                >
            </div>

            <div class="input-container">
                <label>Age: </label>
                <input 
                    type="number"
                    value="5"
                    name="user_age"
                >
            </div>

            <div class="input-container">
                <label>Password: </label>
                <input type="password" name="user_pass">
            </div>

            <div class="input-container">
                <label>E-mail: </label>
                <input 
                    type="email"
                    placeholder="example@email.com"
                    name="user_email"
                >
            </div>

            <div class="input-container">
                <label>Message: </label>
                <textarea></textarea>
            </div>

            <div class="input-container">
                <label>Date: </label>
                <input 
                    type="date"
                    name="date"
                >
            </div>

            <div class="input-container">
                <label>Phone Number: </label>
                <input 
                    type="tel"
                    Placeholder="(XXX)XXX-XXXX"
                    name="user_number"
                >
            </div>

            <button>Send</button>
        </form>

        
    </div>

</body>
</html>
